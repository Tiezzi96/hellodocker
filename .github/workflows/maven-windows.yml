name: CI Java with Maven and Docker in Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    # env:
      # DOCKER_HOST: "tcp://localhost:2375"
    name: Build in Windows
    steps:
    - uses: actions/checkout@v2
    - name: Configure JDK 8
      uses: actions/setup-java@v1
      with:
       java-version: 1.8
    # - name: Docker Config
    #   run: >
    #    sc config docker
    #    binpath="dockerd.exe --run-service -H tcp://localhost:2375"
    # - name: Get Service Docker
    #   run: get-service *docker*
    # - name: Docker restart
    #  run: restart-service *docker*
    # - name: Docker info
    #  run: docker info
    - name: Cache of Maven packages
      uses: actions/cache@v2
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
        restore-keys: ${{ runner.os }}-m2-
    - name: Build with Maven
      run: mvn verify -Pdocker
      working-directory: hellodocker 
